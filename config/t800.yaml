# T800 遥控行走参数（来自官方 SDK default.yaml）
# 数组顺序 = 关节顺序 J00..J24，与 t800.xml 一致

paths:
  model: mujoco/t800.xml
  policy: model/t800_260618_165257_30000.mnn

joints:
  names:
    - J00_HIP_PITCH_L
    - J01_HIP_ROLL_L
    - J02_HIP_YAW_L
    - J03_KNEE_PITCH_L
    - J04_ANKLE_PITCH_L
    - J05_ANKLE_ROLL_L
    - J06_HIP_PITCH_R
    - J07_HIP_ROLL_R
    - J08_HIP_YAW_R
    - J09_KNEE_PITCH_R
    - J10_ANKLE_PITCH_R
    - J11_ANKLE_ROLL_R
    - J12_TORSO_YAW
    - J13_SHOULDER_PITCH_L
    - J14_SHOULDER_ROLL_L
    - J15_SHOULDER_YAW_L
    - J16_ELBOW_PITCH_L
    - J17_ELBOW_YAW_L
    - J18_SHOULDER_PITCH_R
    - J19_SHOULDER_ROLL_R
    - J20_SHOULDER_YAW_R
    - J21_ELBOW_PITCH_R
    - J22_ELBOW_YAW_R
    - J23_HEAD_PITCH
    - J24_HEAD_YAW
  # 22 个策略可控关节 = 12 腿(J00..J11) + 10 臂(J13..J22)
  # 排除 J12 躯干扭转与 J23/J24 头部
  active:
    - J00_HIP_PITCH_L
    - J01_HIP_ROLL_L
    - J02_HIP_YAW_L
    - J03_KNEE_PITCH_L
    - J04_ANKLE_PITCH_L
    - J05_ANKLE_ROLL_L
    - J06_HIP_PITCH_R
    - J07_HIP_ROLL_R
    - J08_HIP_YAW_R
    - J09_KNEE_PITCH_R
    - J10_ANKLE_PITCH_R
    - J11_ANKLE_ROLL_R
    - J13_SHOULDER_PITCH_L
    - J14_SHOULDER_ROLL_L
    - J15_SHOULDER_YAW_L
    - J16_ELBOW_PITCH_L
    - J17_ELBOW_YAW_L
    - J18_SHOULDER_PITCH_R
    - J19_SHOULDER_ROLL_R
    - J20_SHOULDER_YAW_R
    - J21_ELBOW_PITCH_R
    - J22_ELBOW_YAW_R

control:
  # 默认站姿 (25,) rad
  default_q: [
    -0.06, 0.0, 0.0, 0.12, -0.06, 0.0,   # J00-J05 左腿
    -0.06, 0.0, 0.0, 0.12, -0.06, 0.0,   # J06-J11 右腿
    0.0,                                  # J12 躯干
    0.0, 0.15, 0.0, -0.25, 0.0,          # J13-J17 左臂
    0.0, -0.15, 0.0, -0.25, 0.0,         # J18-J22 右臂
    0.0, 0.0,                             # J23-J24 头
  ]
  # PD 刚度 (25,) N·m/rad
  kp: [
    180, 100, 100, 180, 40, 40,   # 左腿
    180, 100, 100, 180, 40, 40,   # 右腿
    100,                           # 躯干
    60, 50, 50, 60, 50,           # 左臂
    60, 50, 50, 60, 50,           # 右臂
    100, 100,                      # 头
  ]
  # PD 阻尼 (25,) N·m·s/rad
  kd: [
    5.0, 3.0, 3.0, 5.0, 0.3, 0.3,   # 左腿
    5.0, 3.0, 3.0, 5.0, 0.3, 0.3,   # 右腿
    5.0,                             # 躯干
    0.3, 0.3, 0.3, 0.3, 0.3,        # 左臂
    0.3, 0.3, 0.3, 0.3, 0.3,        # 右臂
    1.0, 1.0,                        # 头
  ]
  # 动作→目标角缩放 (22,) rad，仅主动关节
  action_scale: [
    0.5, 0.2, 0.2, 0.5, 0.5, 0.2,   # 左腿
    0.5, 0.2, 0.2, 0.5, 0.5, 0.2,   # 右腿
    0.2, 0.2, 0.05, 0.2, 0.05,      # 左臂
    0.2, 0.2, 0.05, 0.2, 0.05,      # 右臂
  ]

observation:
  # 单帧 72 维 = 22角偏差 + 22角速度 + 22上一动作 + 3角速度 + 3重力投影
  joint_pos_scale: 1.0     # 22
  joint_vel_scale: 0.05    # 22
  prev_action_scale: 1.0   # 22
  ang_vel_scale: 1.0       # 3
  gravity_scale: 1.0       # 3
  clip: 100.0
  history: 15              # 策略输入保留最近 15 帧观测

command:
  # 指令 [vx, vy, yaw_rate] 缩放
  scale: [3.0, 2.0, 1.5]
  action_clip: 100.0

timing:
  control_dt: 0.01         # 策略控制周期 100 Hz
  timestep: 0.002          # 物理仿真步长 500 Hz
  # frame_skip = control_dt / timestep = 5（由 config.py 计算）

reset:
  base_z: 1.02             # 浮基初始高度 (m)
  base_pos: [-5.0, -5.0]   # 出生点 x,y —— 仓库 Alpha home bay（平地场景改回 [0, 0]）

teleop:
  cmd_step: 0.1            # 每次按键速度增量 (m/s 或 rad/s)
  vx_limit: 0.6
  yaw_limit: 1.0
  soft_start_duration: 0.5 # 软启动时长 (s)
  soft_start_ratio_min: 0.2
